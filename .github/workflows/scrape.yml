name: scrape

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape
        run: ./scrape.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # meta.json changes every run, so this commits once per scrape,
          # giving a heartbeat that distinguishes "source unchanged" from "scraper down".
          git diff --quiet --staged || git commit -m "scrape $(jq -r .scraped_at meta.json)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1
